name: Get Citation Data

on:
  workflow_dispatch:        # manual "Run workflow" button — use this to test
  schedule:
    - cron: '0 8 * * *'     # daily 08:00 UTC

permissions:
  contents: write

concurrency:
  group: scholar-stats
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: google_scholar_crawler/requirements.txt

      - name: Install deps
        run: pip install -r google_scholar_crawler/requirements.txt

      - name: Crawl Google Scholar
        env:
          GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}
        run: |
          cd google_scholar_crawler
          python3 main.py

      - name: Publish to google-scholar-stats branch
        run: |
          cd google_scholar_crawler/results
          if [ ! -f gs_data_shieldsio.json ]; then
            echo "No data produced (crawl likely blocked). Keeping existing data."
            exit 0
          fi
          git init -q
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add ./*.json
          git commit -q -m "Updated Citation Data"
          git push --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:google-scholar-stats
          echo "Published to google-scholar-stats."
